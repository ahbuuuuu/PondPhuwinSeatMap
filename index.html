<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0c10">
    <title>POND PHUWIN · Space Soul-dyssey CONCERT</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ── 聊天抽屜切換按鈕 ── -->
<button class="chat-toggle-btn" id="ui-chat-toggle" onclick="openChat()">💬 聊天</button>

<!-- ── 聊天抽屜遮罩 ── -->
<div class="chat-overlay" id="chat-overlay" onclick="closeChat()"></div>

<!-- ── 聊天抽屜 ── -->
<div class="chat-drawer" id="chat-drawer">
    <div class="chat-drawer-header">
        <h3 id="ui-chat-title">💬 聊天室</h3>
        <button class="chat-close-btn" onclick="closeChat()">✕</button>
    </div>
    <select class="form-input" id="chat-zone-select" onchange="loadChatMessages()" style="margin:8px 12px 0; width:calc(100% - 24px);">
        <option value="">全部區域</option>
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="A3">A3</option>
        <option value="A4">A4</option>
        <option value="B1">B1</option>
        <option value="B2">B2</option>
        <option value="B3">B3</option>
        <option value="C1">C1</option>
        <option value="C2">C2</option>
        <option value="C3">C3</option>
        <option value="SB">SB</option>
        <option value="SC">SC</option>
        <option value="SD">SD</option>
        <option value="SE">SE</option>
        <option value="SF">SF</option>
        <option value="SG">SG</option>
        <option value="SH">SH</option>
        <option value="SI">SI</option>
        <option value="SJ">SJ</option>
        <option value="SK">SK</option>
        <option value="SL">SL</option>
        <option value="SM">SM</option>
        <option value="SN">SN</option>
        <option value="FF">FF</option>
        <option value="HH">HH</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="G">G</option>
        <option value="H">H</option>
        <option value="I">I</option>
        <option value="J">J</option>
        <option value="K">K</option>
        <option value="L">L</option>
        <option value="M">M</option>
        <option value="N">N</option>
        <option value="O">O</option>
        <option value="P">P</option>
        <option value="Q">Q</option>
        <option value="R">R</option>
        <option value="S">S</option>
    </select>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-row">
        <input type="text" id="chat-name" placeholder="暱稱" style="flex:0 0 70px;">
        <input type="text" id="chat-input" placeholder="說點什麼...">
        <button class="chat-send-btn" id="ui-chat-send" onclick="sendChatMessage()">送出</button>
    </div>
</div>

<div class="container">

    <!-- ── Header ── -->
    <header>
        <h1 id="ui-title">POND PHUWIN · Space Soul-dyssey CONCERT</h1>
        <div class="control-row">
            <select id="date-select" onchange="switchDate()">
                <option value="8/21">8/21</option>
                <option value="8/22">8/22</option>
                <option value="8/23">8/23</option>
            </select>
            <div class="lang-group">
                <button class="btn-ui" onclick="setLang('zh')">中</button>
                <button class="btn-ui" onclick="setLang('en')">EN</button>
                <button class="btn-ui" onclick="setLang('th')">TH</button>
            </div>
        </div>
    </header>

    <!-- ── Notify Bar ── -->
    <div id="notify-bar">⏳ 載入中...</div>

    <!-- ── Seat Map ── -->
    <div class="map-wrapper" id="map-wrapper">
        <img id="seat-img" src="seatmap.jpg" alt="Seat Map">
    </div>
    <div id="name-tooltip" class="name-tooltip"></div>

    <!-- ── Stats ── -->
    <div class="stats-area">
        <h3 id="ui-count-label">已入座：0 人</h3>
        <div style="display:flex; gap:6px;">
            <button class="btn-list" onclick="openModal('list-modal')">💖 List</button>
            <button class="btn-list" id="ui-mine-btn" onclick="openModal('mine-modal')" style="background:transparent; border:1px solid var(--main); color:var(--main);">🔑 我的座位</button>
        </div>
    </div>

</div>

<!-- ── 登記座位 Modal ── -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3 id="ui-m-title">登記座位</h3>
        <input  class="form-input" type="text"   id="name" placeholder="暱稱">
        <select class="form-input" id="zone">
            <option value="" id="ui-zone-placeholder">選擇你的座位區域</option>
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="A3">A3</option>
            <option value="A4">A4</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
            <option value="B3">B3</option>
            <option value="C1">C1</option>
            <option value="C2">C2</option>
            <option value="C3">C3</option>
            <option value="SB">SB</option>
            <option value="SC">SC</option>
            <option value="SD">SD</option>
            <option value="SE">SE</option>
            <option value="SF">SF</option>
            <option value="SG">SG</option>
            <option value="SH">SH</option>
            <option value="SI">SI</option>
            <option value="SJ">SJ</option>
            <option value="SK">SK</option>
            <option value="SL">SL</option>
            <option value="SM">SM</option>
            <option value="SN">SN</option>
            <option value="FF">FF</option>
            <option value="HH">HH</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="G">G</option>
            <option value="H">H</option>
            <option value="I">I</option>
            <option value="J">J</option>
            <option value="K">K</option>
            <option value="L">L</option>
            <option value="M">M</option>
            <option value="N">N</option>
            <option value="O">O</option>
            <option value="P">P</option>
            <option value="Q">Q</option>
            <option value="R">R</option>
            <option value="S">S</option>
        </select>
        <input  class="form-input" type="file"   id="img"  accept="image/*">
        <select class="form-input" id="emoji">
            <option value="" id="ui-emoji-placeholder">或選 Emoji（不上傳圖片時使用）</option>
            <option value="🐻">🐻 熊熊</option>
            <option value="🐼">🐼 熊貓</option>
            <option value="🐱">🐱 小貓</option>
            <option value="🐶">🐶 小狗</option>
            <option value="🧡">🧡 橘心</option>
            <option value="🤍">🤍 白心</option>
            <option value="🌙">🌙 月亮</option>
            <option value="⭐">⭐ 星星</option>
        </select>
        <button class="btn-confirm"   id="ui-btn"        onclick="save()">確認登記</button>
        <button class="btn-secondary" id="ui-cancel-btn" onclick="closeModal('modal')">取消</button>
    </div>
</div>

<!-- ── 登記成功，顯示密碼 Modal ── -->
<div class="modal" id="pin-modal">
    <div class="modal-content">
        <h3 id="ui-pin-title">🎉 登記成功！</h3>
        <p id="ui-pin-desc" style="color:rgba(255,255,255,0.7); font-size:13px; margin-bottom:8px;">
            請記住這組密碼，之後可用來修改或刪除你的座位：
        </p>
        <div id="pin-display" style="font-size:32px; font-weight:700; color:var(--main); text-align:center; letter-spacing:8px; background:rgba(0,255,204,0.08); border:1px solid var(--main); border-radius:10px; padding:16px; margin-bottom:14px;"></div>
        <button class="btn-confirm" id="ui-pin-confirm" onclick="closeModal('pin-modal')">我記住了</button>
    </div>
</div>

<!-- ── 我的座位（憑密碼修改/刪除） Modal ── -->
<div class="modal" id="mine-modal">
    <div class="modal-content">
        <h3 id="ui-mine-title">🔑 我的座位</h3>
        <input class="form-input" type="text" id="mine-name" placeholder="暱稱">
        <input class="form-input" type="text" id="mine-pin" placeholder="4 位數密碼" maxlength="4" inputmode="numeric">
        <button class="btn-confirm" id="ui-mine-query" onclick="verifyMine()">查詢</button>
        <div id="mine-result" style="margin-top:14px;"></div>
        <button class="btn-secondary" id="ui-mine-close" onclick="closeModal('mine-modal')" style="margin-top:10px;">關閉</button>
    </div>
</div>

<!-- ── 名單 Modal ── -->
<div class="modal" id="list-modal">
    <div class="modal-content">
        <h3 id="ui-list-title">💖 名單列表</h3>
        <input class="form-input" type="text" id="search-input" placeholder="🔍 搜尋暱稱..." oninput="renderList()" style="margin-bottom:10px;">
        <div id="seat-list"></div>
        <hr class="divider">
        <button class="btn-secondary" id="ui-close-btn" onclick="closeModal('list-modal')" style="margin-bottom:6px;">關閉</button>
        <button class="btn-ui" onclick="toggleAdmin()" style="width:100%; padding:9px; font-size:13px;">⚙️ Admin</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
